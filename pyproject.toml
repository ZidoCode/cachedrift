[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachedrift"
version = "0.1.0"
description = "Static analyzer that finds the code patterns silently killing your LLM prompt cache."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZidoCode" }]
keywords = ["llm", "prompt-cache", "anthropic", "openai", "static-analysis", "cost", "caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
cachedrift = "cachedrift:main"

[tool.hatch.build.targets.wheel]
only-include = ["cachedrift.py"]
sources = ["."]

[tool.hatch.build.targets.sdist]
only-include = ["cachedrift.py", "test_cachedrift.py", "stress_test.py", "README.md", "LICENSE"]
