name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest test_cachedrift.py -q
      - name: Stress test (zero-crash gate)
        run: python stress_test.py
      - name: Self-scan (dogfood — the docstring intentionally contains example patterns; rc 2 proves detection)
        run: |
          set +e
          python cachedrift.py cachedrift.py --min-severity info
          rc=$?
          if [ "$rc" -ne 2 ]; then echo "self-scan expected rc=2 (findings prove detection works), got $rc"; exit 1; fi
          python cachedrift.py stress_test.py --rules CD99
          rc=$?
          if [ "$rc" -ne 0 ]; then echo "no-match scan expected rc=0, got $rc"; exit 1; fi
